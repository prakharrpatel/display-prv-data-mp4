<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Video Player</title>
    <!-- Tailwind CSS for clean layout -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
    </style>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4 sm:p-8">

    <!-- Main Container -->
    <main class="w-full max-w-4xl bg-slate-800 rounded-2xl p-4 sm:p-6 shadow-2xl border border-slate-700/50">
        <!-- Video Player Wrapper -->
        <div class="relative w-full aspect-video rounded-xl overflow-hidden bg-black shadow-inner">
            <video 
                controls 
                preload="metadata"
                class="w-full h-full object-contain focus:outline-none"
            >
                <!-- Sample Video Source -->
                <source src="https://raw.githubusercontent.com/prakharrpatel/prv-data/main/WhatsApp%20Video%202026-10-20%20at%204.10.12%20PM.mp4" type="video/mp4">
                
                <!-- Fallback text for unsupported browsers -->
                <p class="text-white text-center p-4">
                    Your browser does not support HTML5 video.
                </p>
            </video>
        </div>
    </main>

</body>
</html>
